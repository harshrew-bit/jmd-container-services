    <!-- Anti-FOUC Theme Pre-initialization -->
    <script>
      try {
        const storedTheme = localStorage.getItem('jmd_theme');
        if (storedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else if (storedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (_) {}
    </script>
  </head>
  <body class="bg-white dark:bg-charcoal-950 text-charcoal-900 dark:text-charcoal-100 font-sans antialiased selection:bg-brand-700 selection:text-white transition-colors duration-150">
